[package]
name = "locsim"
version = "0.1.0"
edition = "2021"
description = "A universal CLI-based location simulator in Rust"
authors = ["locsim contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
directories = "6.0"
colored = "3.0"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
