[package]
name = "locsim"
version = "0.1.0"
edition = "2021"
description = "A universal CLI-based location simulator in Rust for testing location-aware apps across Windows, Linux, macOS, Android, and browsers"
authors = ["itznan <https://github.com/itznan>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/itznan/locsim"
homepage = "https://github.com/itznan/locsim"
keywords = ["geolocation", "gps", "simulator", "cli", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]


[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
directories = "6.0"
colored = "3.0"
async-trait = "0.1"
clap_complete = "4.5"
toml = "0.8"


[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

